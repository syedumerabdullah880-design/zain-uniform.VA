<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E36"/>
      <stop offset="50%" stop-color="#0A1322"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6BE"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA8220"/>
      <stop offset="100%" stop-color="#E5C772"/>
    </linearGradient>

    <!-- Inner Glow / Shadow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="16" y="16" width="168" height="168" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="100" cy="96" r="70" fill="url(#goldGlow)"/>

  <!-- Monogram ZYN Crest / Geometric Silhouette -->
  <!-- Tailor Needle / Thread Element at top -->
  <g filter="url(#shadow)">
    <!-- Crown / Crest Accent -->
    <path d="M78 44 L100 32 L122 44 L114 48 L100 40 L86 48 Z" fill="url(#goldGrad)"/>
    <circle cx="100" cy="28" r="2.5" fill="url(#goldGrad)"/>

    <!-- Stylized ZYN Typography -->
    <!-- Z: Sleek bold modern geometry -->
    <path d="M46 58 H90 L52 114 H94 V124 H44 L82 68 H46 Z" fill="url(#goldGrad)"/>

    <!-- Y: Flowing elegant central pillar and arms -->
    <path d="M88 58 L102 86 L116 58 H128 L108 96 V124 H96 V96 L76 58 Z" fill="url(#goldGrad)"/>

    <!-- N: Sharp interlocking right wing -->
    <path d="M120 58 H132 L154 112 V58 H166 V124 H154 L132 70 V124 H120 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Divider & Subtitle -->
  <line x1="44" y1="140" x2="156" y2="140" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="100,138 103,141 100,144 97,141" fill="url(#goldGrad)"/>

  <!-- Brand Wordmark below ZYN -->
  <text x="100" y="157" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" letter-spacing="3.5" fill="url(#goldGrad)">
    ZAIN UNIFORMS
  </text>
  <text x="100" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="7.5" letter-spacing="3" fill="#94A3B8">
    RAWALPINDI · EST. 2026
  </text>
</svg>
